# ==============================================================================
# The app stack on the twl Raspberry Pi: agent (8910) + web (3000) on one public
# host, https://${APP_NAME}.twl.dtolb.com, split by path.
#
# Deploy with `twl deploy`. The Pi's post-receive hook runs
#   docker compose -p <app> -f docker-compose.yml -f <override> --env-file <app env> up -d --build
# where the generated override adds the `twl` network, `traefik.enable=true`,
# `twl.host=<app>` and `env_file: <app env>` to the `web` service ONLY. The agent
# therefore declares its own network and labels below, and takes its config as
# bare keys resolved from that `--env-file`. Set values with `twl env set`.
#
# ⚠ THE FILENAME IS LOAD-BEARING. tests/architecture.test.ts asserts this file
# exists under this name, that every prefix in shared/twilio-paths.ts appears as
# a literal PathPrefix, and that the labels use the list form.
# ==============================================================================

services:
  # ---------------------------------------------------------------------- agent
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      secrets: [corp_ca]
    container_name: ${APP_NAME}-agent

    # `"no"`: the stack publishes unauthenticated endpoints, so it must not come
    # back by itself after a Pi reboot. Bring it back with `twl redeploy`.
    # Quoted, because bare `no` is a YAML boolean.
    restart: "no"

    # Bare names: each resolves from twl's `--env-file`, and is omitted when unset.
    environment:
      - APP_NAME
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_API_KEY
      - TWILIO_API_SECRET
      - TWILIO_PHONE_NUMBER
      - TWILIO_VOICE_PUBLIC_DOMAIN
      - TWILIO_CONVERSATION_CONFIGURATION_ID
      - TWILIO_STUDIO_HANDOFF_FLOW_SID
      - TWILIO_KNOWLEDGE_BASE_ID
      - TWILIO_LOG_LEVEL
      - OPENAI_API_KEY
      - MODEL
      - LANGFUSE_BASE_URL
      - LANGFUSE_PUBLIC_KEY
      - LANGFUSE_SECRET_KEY
      - NODE_EXTRA_CA_CERTS=/run/secrets/corp_ca
    secrets: [corp_ca]

    # The saved ConversationRelay profile and presets (server/twilio/cr-store.ts).
    volumes:
      - tuning_data:/app/data

    # TAC_SHUTDOWN_TIMEOUT_MS is 45s; Docker's default grace is 10s.
    stop_grace_period: 60s

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8910/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    labels:
      - traefik.enable=true
      # One physical line: the architecture test substring-matches each PathPrefix.
      - traefik.http.routers.${APP_NAME}-agent.rule=Host(`${APP_NAME}.twl.dtolb.com`) && (PathPrefix(`/webhook`) || PathPrefix(`/twiml`) || PathPrefix(`/ws`) || PathPrefix(`/conversation-relay-callback`) || PathPrefix(`/twilio/call-events`) || PathPrefix(`/api`) || PathPrefix(`/events`) || PathPrefix(`/health`))
      - traefik.http.routers.${APP_NAME}-agent.priority=100
      - traefik.http.routers.${APP_NAME}-agent.middlewares=${APP_NAME}-proto
      - traefik.http.routers.${APP_NAME}-agent.service=${APP_NAME}-agent
      - traefik.http.services.${APP_NAME}-agent.loadbalancer.server.port=8910
      # Lowercase `customrequestheaders`: the architecture test matches it literally.
      - traefik.http.middlewares.${APP_NAME}-proto.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.docker.network=twl
    networks: [twl]

  # ------------------------------------------------------------------------ web
  web:
    build:
      # Repo root, NOT ./web — web/ imports ../shared/*.ts. See Dockerfile.web.
      context: .
      dockerfile: Dockerfile.web
      secrets: [corp_ca]
    container_name: ${APP_NAME}-web
    restart: "no"
    # The twl override adds `traefik.enable`, `twl.host`, the network and env_file.
    labels:
      - traefik.http.routers.${APP_NAME}-web.rule=Host(`${APP_NAME}.twl.dtolb.com`)
      - traefik.http.routers.${APP_NAME}-web.priority=1
      - traefik.http.routers.${APP_NAME}-web.service=${APP_NAME}-web
      - traefik.http.services.${APP_NAME}-web.loadbalancer.server.port=3000

networks:
  twl:
    external: true

volumes:
  tuning_data:

secrets:
  # /dev/null mounts as an empty file, and Node then uses the system bundle.
  corp_ca:
    file: ${CORP_CA_PATH:-/dev/null}
